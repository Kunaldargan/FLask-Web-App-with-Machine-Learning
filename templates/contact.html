{% extends "base.html" %}

{% block title %}Contact{% endblock %}

{% block content %}
<section class="section shell narrow-page">
  <p class="eyebrow">Contact</p>
  <h1>Help shape the next iteration.</h1>
  <p class="lede">This demo does not send email, but the form gives the project a clean place for feedback while keeping the interaction testable.</p>
  <form class="contact-form" action="{{ url_for('contact') }}" method="post">
    <div class="field"><label for="name">Name</label><input id="name" name="name" type="text" autocomplete="name" required></div>
    <div class="field"><label for="email">Email <span class="muted">optional</span></label><input id="email" name="email" type="email" autocomplete="email"></div>
    <div class="field"><label for="message">Message</label><textarea id="message" name="message" rows="6" required></textarea></div>
    <button class="button button-primary" type="submit">Send feedback <span aria-hidden="true">→</span></button>
  </form>
</section>
{% endblock %}
